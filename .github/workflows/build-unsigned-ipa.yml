name: Build Signed iOS IPA (macOS GUI / VNC + 2FA)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nom de l application'
        required: false
        default: 'MonAppWeb'

jobs:
  build-ipa-vnc:
    name: Interface graphique macOS (Xcode + Apple ID gratuit 7j)
    runs-on: macos-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer XcodeGen & RustDesk
        run: |
          if ! command -v xcodegen &> /dev/null; then brew install xcodegen; fi
          brew install --cask rustdesk
          xcodegen generate --spec project.yml

      - name: Démarrer RustDesk (service root), ouvrir Xcode et attendre la validation 2FA
        run: |
          RD_BIN="/Applications/RustDesk.app/Contents/MacOS/RustDesk"
          xattr -dr com.apple.quarantine /Applications/RustDesk.app || true
          sudo "$RD_BIN" --install-service || true
          open -a RustDesk || sudo "$RD_BIN" --server > /tmp/rustdesk.log 2>&1 &
          sleep 5

          sudo "$RD_BIN" --password "IpaForge2026!"
          sleep 5
          RD_ID=$(sudo "$RD_BIN" --get-id 2>/dev/null | xargs || true)

          cat << 'CMD' > "$HOME/Desktop/Terminer_et_Compiler.command"
          #!/bin/bash
          touch /tmp/continue_build
          echo "Compilation relancée ! Vous pouvez fermer cette fenêtre."
          CMD
          chmod +x "$HOME/Desktop/Terminer_et_Compiler.command"

          cat << 'GUIDE' > "$HOME/Desktop/INSTRUCTIONS_XCODE.md"
          # Guide rapide dans cette VM macOS

          1. Connecter votre compte Apple dans Xcode :
             - Barre du haut : Xcode -> Settings... -> onglet Accounts
             - Cliquez sur "+" en bas à gauche -> Apple Account -> Continue
             - Entrez votre Apple ID + mot de passe + code 2FA recu sur iPhone
             - Fermez Settings une fois "Personal Team" affiche

          2. Activer la signature sur le projet :
             - Panneau gauche d'Xcode : cliquez sur le projet (MonAppWeb) tout en haut
             - Sous TARGETS : selectionnez MonAppWeb -> onglet Signing & Capabilities
             - Cochez "Automatically manage signing"
             - Dans "Team", choisissez votre "Personal Team"
             - En haut d'Xcode (a cote du bouton Play), verifiez "Any iOS Device (arm64)"

          3. Lancer la compilation finale :
             - Allez sur le Bureau (Desktop)
             - Double-cliquez sur "Terminer_et_Compiler.command"
             - Attendez la fin du workflow pour telecharger votre .ipa
          GUIDE

          open -a TextEdit "$HOME/Desktop/INSTRUCTIONS_XCODE.md" || open "$HOME/Desktop/INSTRUCTIONS_XCODE.md" || true
          open "MonAppWeb.xcodeproj"
          echo "========================================================"
          echo "CONNECTEZ-VOUS AVEC RUSTDESK (Portable Windows / Web) :"
          echo "ID RustDesk : ${RD_ID:-Indisponible (voir /tmp/rustdesk.log)}"
          echo "Mot de passe : IpaForge2026!"
          echo "1. Dans Xcode -> Settings -> Accounts : connectez votre Apple ID + 2FA"
          echo "2. Dans Signing & Capabilities : sélectionnez votre Team (Personal Team)"
          echo "3. Double-cliquez sur Terminer_et_Compiler.command sur le Bureau"
          echo "========================================================"

          while [ ! -f /tmp/continue_build ]; do sleep 5; done

      - name: Compiler et empaqueter l'IPA signée 7 jours
        run: |
          xcodebuild \
            -project "MonAppWeb.xcodeproj" \
            -scheme "MonAppWeb" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -allowProvisioningUpdates \
            clean build

          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/MonAppWeb.app" Payload/
          zip -qry "MonAppWeb-signed-7d.ipa" Payload

      - name: Publier l'artefact .ipa signée
        uses: actions/upload-artifact@v4
        with:
          name: MonAppWeb-signed-7d-ipa
          path: MonAppWeb-signed-7d.ipa
          retention-days: 14
